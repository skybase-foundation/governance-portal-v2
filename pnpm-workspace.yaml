# pnpm v11 reads project-wide settings only from this file.
# - .npmrc is auth/registry only.
# - The `pnpm` and `resolutions` fields of package.json are no longer read.

# Supply-chain buffer: only install dependency versions published >= 7 days ago.
# (v11 defaults to 1 day; we keep the 7-day window inherited from .npmrc.)
minimumReleaseAge: 10080

# Use bash for `scripts` (preserves prior .npmrc behaviour).
scriptShell: bash

# Security overrides. Migrated from `package.json#pnpm.overrides`, with
# `elliptic` folded in from the top-level `resolutions` block (pnpm v11
# no longer applies `resolutions`).
#
# APP-660: raised/added entries below clear the remaining critical/high
# advisories from `pnpm audit`. Range-scoped keys (`pkg@<range>`) keep each
# override within the major line its consumers already depend on.
overrides:
  elliptic: ^6.6.1
  axios: ^1.20.0
  dompurify: ^3.4.17
  minimatch: ^9.0.7
  node-forge: ^1.4.0
  tar-fs: ^2.1.4
  ws: ^8.21.0
  cross-spawn: ^7.0.5
  brace-expansion: ^2.1.7
  picomatch: ^4.0.3
  sharp: ^0.35.5
  # Runtime (wagmi / swagger-ui-react / next-swagger-doc / next / gray-matter)
  hono: ^4.13.7
  unstorage@>=1 <2: ^1.17.5
  h3@>=1 <2: ^1.15.9
  serialize-javascript: ^7.0.5
  socket.io-parser: ^4.2.7
  preact: ^10.27.3
  defu: ^6.1.5
  form-data@>=4 <5: ^4.0.6
  follow-redirects: ^1.16.1
  validator: ^13.15.22
  immutable@<4: ^3.8.4
  js-yaml@<4: ^3.15.2
  js-yaml@>=4: ^4.3.2
  postcss@>=8 <9: ^8.5.23
  nanoid@>=3 <4: ^3.3.18
  source-map-js: ^1.2.2
  browserslist: ^4.28.7
  # Deliberately unscoped: no patched zod 3.x exists. The 3.x consumers
  # (@reown/appkit-wallet, @coinbase/cdp-sdk, abitype) only use APIs zod 4
  # still supports, and abitype's peer range already allows ^4.
  zod: ^4.6.6
  # Dev / tooling (vite, eslint, graphql-codegen)
  rollup@>=4 <5: ^4.59.0
  flatted: ^3.4.2
  shell-quote: ^1.8.5
  '@graphql-tools/utils@<12': ^12.0.3

# `next/babel` (used via .babelrc) emits `@babel/runtime` imports and resolves
# them from next's own directory, but next doesn't declare the package, so it
# falls through to pnpm's hidden hoist. @graphql-codegen/cli 7 pulls in
# @babel/runtime 8 (no `./regenerator` export), which can win that hoist and
# break `next build`. Pin next's copy to 7.x.
packageExtensions:
  next:
    dependencies:
      '@babel/runtime': ^7.29.2

# pnpm v11 defaults `strictDepBuilds: true`, so any dependency with an
# install/build script now fails the install unless it has an entry here.
# Under v10 these were silently ignored — denying them preserves that
# production behavior. Flip to `true` later if a runtime gap appears.
allowBuilds:
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  bufferutil: false
  core-js-pure: false
  esbuild: false
  fsevents: false
  keccak: false
  protobufjs: false
  sharp: false
  tree-sitter: false
  tree-sitter-json: false
  utf-8-validate: false
